- name: Deploy Application direct
  hosts: raspberrypi
  become: yes
  vars:
    smart_home_dir: "/home/{{ ansible_user }}/Luca_Smart_Home"
    smart_home_service: luca-smart-home
    smart_home_port: 5000
    # PostgreSQL database for the settings, the password comes from the GitHub secret DB_PASSWORD
    smart_home_db_user: "{{ lookup('env', 'DB_USER') | default('luca', true) }}"
    smart_home_db_name: "{{ lookup('env', 'DB_NAME') | default('smarthome', true) }}"
    smart_home_db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
  tasks:
    - name: Check that the database password is set
      assert:
        that: smart_home_db_password | length > 0
        fail_msg: "DB_PASSWORD ist nicht gesetzt (GitHub-Secret DB_PASSWORD anlegen)"
      no_log: true

    - name: Ensure build-essential and node are installed
      apt:
        name:
          - build-essential
          - nodejs
          - npm
          - postgresql-client
        state: present
        update_cache: yes

    ################ Stop the running Node server ################
    - name: Gather services
      service_facts:

    # SIGTERM lets server.js stop ambilight.c, which switches the LEDs off
    - name: Stop the Node server service
      systemd:
        name: "{{ smart_home_service }}"
        state: stopped
      when: (smart_home_service + '.service') in ansible_facts.services

    # [n]ode: the pattern must not match the command line of this shell itself
    - name: Stop Node servers that were started by hand
      shell: pkill -TERM -f "[n]ode .*Node/server\.js" && sleep 2 || true
      changed_when: false

    ################ Copy the Smart Home folder ################
    # settings.json is not in the local folder (.gitignore), so the saved settings on the Pi stay
    - name: Copy the Smart Home folder to the Raspberry Pi
      copy:
        src: "{{ playbook_dir }}/../Luca_Smart_Home/"
        dest: "{{ smart_home_dir }}/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: u=rwX,g=rX,o=rX

    # both files can run on every deploy: schema.sql only creates what is missing,
    # seed.sql only inserts the start data while there is no ambilight feature yet
    - name: Create database schema and start data
      command: >-
        psql -v ON_ERROR_STOP=1 -h localhost
        -U {{ smart_home_db_user }} -d {{ smart_home_db_name }}
        -f {{ smart_home_dir }}/Database/{{ item }}
      environment:
        PGPASSWORD: "{{ smart_home_db_password }}"
      loop:
        - schema.sql
        - seed.sql
      changed_when: false

    - name: Build Smart Home C component
      command: make
      args:
        chdir: "{{ smart_home_dir }}/C"
      become_user: "{{ ansible_user }}"
      register: smart_home_make
      changed_when: "'is up to date' not in smart_home_make.stdout"

    - name: Install Node dependencies
      command: npm ci --omit=dev
      args:
        chdir: "{{ smart_home_dir }}/Node"
      become_user: "{{ ansible_user }}"

    ################ Start the Node server ################
    # only readable by root, because it contains the database password
    - name: Write database connection for the Node server
      copy:
        dest: "/etc/{{ smart_home_service }}.env"
        mode: "0600"
        content: |
          PGHOST=localhost
          PGPORT=5432
          PGUSER={{ smart_home_db_user }}
          PGDATABASE={{ smart_home_db_name }}
          PGPASSWORD={{ smart_home_db_password }}
      no_log: true

    - name: Install systemd service for the Node server
      copy:
        dest: "/etc/systemd/system/{{ smart_home_service }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Smart Home Webserver
          After=network.target postgresql.service
          Wants=postgresql.service

          [Service]
          Type=simple
          User=root
          WorkingDirectory={{ smart_home_dir }}/Node
          ExecStart=/usr/bin/env node {{ smart_home_dir }}/Node/server.js
          Environment=PORT={{ smart_home_port }}
          EnvironmentFile=/etc/{{ smart_home_service }}.env
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable the Node server
      systemd:
        name: "{{ smart_home_service }}"
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Check that the Node server answers
      uri:
        url: "http://127.0.0.1:{{ smart_home_port }}/api/ambilight"
      register: ambilight_api
      retries: 10
      delay: 2
      until: ambilight_api.status == 200
