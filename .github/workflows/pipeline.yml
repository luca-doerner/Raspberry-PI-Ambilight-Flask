name: Deploy with Ansible

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible, sshpass and cloudflared
        run: |
          sudo apt update && sudo apt install -y ansible sshpass
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # SERVER_IP is the SSH hostname of the Cloudflare tunnel (e.g. ssh.example.com),
      # cloudflared authenticates at Cloudflare Access with the service token
      - name: Run Ansible Playbook
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_USER: ${{ vars.SSH_USER }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i deploy/inventory.ini deploy/ansible.yml