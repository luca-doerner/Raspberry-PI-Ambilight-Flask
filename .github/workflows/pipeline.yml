name: Deploy with Ansible

on:
  push:
    branches:
      - '**'  # Runs when changes are pushed to "main"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./Ambilight_Flask
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ambilight-flask:latest
            ghcr.io/${{ github.repository_owner }}/ambilight-flask:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible

      - name: Run Ansible Playbook
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_USER: ${{ vars.SSH_USER }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "User: $SSH_USER, IP: $SERVER_IP"
          ansible-playbook -i deploy/inventory.ini deploy/ansible.yml --extra-vars "ansible_ssh_pass=$SSH_PASSWORD ansible_host=$SERVER_IP ansible_user=$SSH_USER github_repo_owner=$GITHUB_REPO_OWNER"
